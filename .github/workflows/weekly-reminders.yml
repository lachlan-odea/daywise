name: Weekly reminders

on:
  schedule:
    # Fridays 06:00 UTC ≈ 4pm AEST / 5pm AEDT (Australian afternoon).
    - cron: '0 6 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log only — do not actually send'
        type: boolean
        default: false
      test_email:
        description: 'Send every message to this address instead of real users (testing)'
        default: ''

# This job holds a full-admin Firebase service account, so keep the token minimal.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't leave GITHUB_TOKEN in .git/config where a dependency's install
          # script could read it.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: this job's next step holds FIREBASE_SERVICE_ACCOUNT (which
      # bypasses Firestore rules entirely) and RESEND_API_KEY. Without this flag, a
      # postinstall hook anywhere in the dependency tree could patch the script on
      # disk and run with both secrets. The mailer only needs firebase-admin, which
      # has no build step.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Send weekly reminders
        run: node scripts/send-weekly-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: daywise
          APP_URL: https://lachlan-odea.github.io/daywise
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TEST_EMAIL: ${{ inputs.test_email }}
